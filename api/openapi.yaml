openapi: 3.1.0
info:
  title: Family Office API
  version: 1.0.0
  description: 'REST API for the Family Office wealth platform (PRD section 6). All tenant endpoints require

    a Bearer JWT and an `X-Family-Id` header; the server sets `app.family_id` for Postgres RLS.

    Money is in rupees as decimal strings. Dates are ISO-8601. Lists are cursor-paginated.

    This file is a build contract; route handlers should validate against it (zod schemas are generated from it).

    '
servers:
- url: https://api.familyoffice.example/api/v1
- url: http://localhost:4000/api/v1
security:
- bearerAuth: []
tags:
- name: Auth
- name: Family
- name: Dashboard
- name: Investments
- name: Imports
- name: Real estate
- name: Private
- name: Goals
- name: Banking
- name: Working capital
- name: Tasks
- name: Reports
- name: Documents
- name: Planning & tax
- name: Balance sheet
- name: Analytics
- name: Open data
- name: General ledger
- name: Action plane
- name: Investment policy
- name: Research & proposals
- name: Rebalancing
paths:
  /auth/login:
    post:
      tags:
      - Auth
      security: []
      summary: Password login (step 1; returns mfa_required for MFA users)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Tokens or MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TokenPair'
                - type: object
                  properties:
                    mfa_required:
                      type: boolean
                    mfa_token:
                      type: string
        '401':
          $ref: '#/components/responses/Problem'
  /auth/register:
    post:
      tags:
      - Auth
      security: []
      summary: Self-service sign-up — creates a new user, a new family and makes the user its owner, then logs them in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - name
              - family_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                family_name:
                  type: string
      responses:
        '201':
          description: Tokens for the newly created, signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '409':
          $ref: '#/components/responses/Problem'
  /auth/webauthn/register/options:
    post:
      tags: [Auth]
      summary: Passkey registration — challenge options for navigator.credentials.create()
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialCreationOptions
          content:
            application/json:
              schema: { type: object }
  /auth/webauthn/register/verify:
    post:
      tags: [Auth]
      summary: Passkey registration — verify the browser's RegistrationResponseJSON and store the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: object }
                device_name: { type: string }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { type: object, properties: { registered: { type: boolean } } }
  /auth/webauthn/credentials:
    get:
      tags: [Auth]
      summary: List this user's registered passkeys
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema: { type: object }
  /auth/webauthn/credentials/{id}:
    delete:
      tags: [Auth]
      summary: Remove a registered passkey
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        '204':
          description: Removed
  /auth/webauthn/challenge:
    post:
      tags: [Auth]
      summary: Fresh step-up challenge for an approval — pass the resulting assertion as auth_proof with auth_method:"passkey"
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialRequestOptions
          content:
            application/json:
              schema: { type: object }
  /auth/mfa/verify:
    post:
      tags:
      - Auth
      security: []
      summary: Complete login with TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mfa_token
              - code
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
  /auth/refresh:
    post:
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
  /auth/invite:
    post:
      tags:
      - Auth
      summary: Invite a member to the current family (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
                entity_scope:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '202':
          description: Invitation sent
  /families:
    post:
      tags:
      - Family
      summary: Create a family (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
  /entities:
    get:
      tags:
      - Family
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
    post:
      tags:
      - Family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
  /entities/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Family
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
    get:
      tags: [Family]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Entity'}}}}, '404': {description: Not found}}
  /entities/{id}/gstins:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gstin
              properties:
                gstin:
                  type: string
                  pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$
                registered_on:
                  type: string
                  format: date
      responses:
        '201':
          description: GSTIN added
  /members:
    get:
      tags:
      - Family
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                    role:
                      $ref: '#/components/schemas/Role'
                    entity_scope:
                      type: array
                      items:
                        type: string
  /dashboard:
    get:
      tags:
      - Dashboard
      parameters:
      - $ref: '#/components/parameters/Entity'
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  net_worth:
                    $ref: '#/components/schemas/Money'
                  net_worth_mom_pct:
                    type: number
                  xirr_si_pct:
                    type: number
                  trend:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                        value:
                          $ref: '#/components/schemas/Money'
                  bank_balance_total:
                    $ref: '#/components/schemas/Money'
                  bank_accounts_live:
                    type: integer
                  bank_accounts_total:
                    type: integer
                  idle_cash:
                    $ref: '#/components/schemas/Money'
                  rent:
                    type: object
                    properties:
                      due:
                        $ref: '#/components/schemas/Money'
                      received_count:
                        type: integer
                      overdue_count:
                        type: integer
                  capital_gains_ytd:
                    $ref: '#/components/schemas/Money'
                  est_tax_ytd:
                    $ref: '#/components/schemas/Money'
                  buckets:
                    type: array
                    items:
                      $ref: '#/components/schemas/BucketStatus'
                  allocation:
                    type: array
                    items:
                      type: object
                      properties:
                        asset_class:
                          type: string
                        bucket:
                          $ref: '#/components/schemas/Bucket'
                        value:
                          $ref: '#/components/schemas/Money'
                        pct:
                          type: number
                  by_entity:
                    type: array
                    items:
                      type: object
                      properties:
                        entity_id:
                          type: string
                        name:
                          type: string
                        net_worth:
                          $ref: '#/components/schemas/Money'
                        mom_pct:
                          type: number
                        xirr_pct:
                          type: number
                  attention:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
  /holdings:
    get:
      tags:
      - Investments
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: bucket
        in: query
        schema:
          $ref: '#/components/schemas/Bucket'
      - name: type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingPage'
  /holdings/{id}/lots:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Investments
      responses:
        '200':
          description: Lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lot'
  /investment-txns:
    get:
      tags:
      - Investments
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: instrument_id
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvestmentTxn'
                  next_cursor:
                    type: string
                    nullable: true
    post:
      tags:
      - Investments
      summary: Add a manual transaction (recomputes lots and gains)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentTxnInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTxn'
  /instruments/search:
    get:
      tags:
      - Investments
      summary: Name / symbol / ISIN / AMFI-code search; exact identifiers first, then prefix, then substring; held instruments first among ties
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
      - name: type
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 50
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
  /capital-gains:
    get:
      tags:
      - Investments
      parameters:
      - name: fy
        in: query
        required: true
        schema:
          type: string
          example: 2026-27
      - $ref: '#/components/parameters/Entity'
      responses:
        '200':
          description: Gains summary and lots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapitalGains'
  /capital-gains/export:
    get:
      tags:
      - Investments
      parameters:
      - name: fy
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Entity'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - xlsx
          - pdf
          default: xlsx
      responses:
        '202':
          description: Report job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
  /harvest-candidates:
    get:
      tags:
      - Investments
      parameters:
      - $ref: '#/components/parameters/Entity'
      responses:
        '200':
          description: Loss lots that can offset gains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    holding_id:
                      type: string
                    instrument:
                      type: string
                    unrealised_loss:
                      $ref: '#/components/schemas/Money'
                    term:
                      type: string
                      enum:
                      - short
                      - long
                    note:
                      type: string
  /corporate-actions:
    get:
      tags:
      - Investments
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - applied
          - review
      responses:
        '200':
          description: Corporate actions affecting family holdings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateAction'
  /corporate-actions/{id}/apply:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Investments
      summary: Apply a pending or reviewed corporate action to this family's lots (demerger / merger take their parameters here)
      description: 'Only lots bought before the ex-date participate. Bonus adds zero-cost lots dated ex-date; split rescales lots; dividend records a transaction on the ex-date quantity; demerger moves cost_split_pct of each lot''s cost to the new instrument keeping buy dates; merger converts lots at the ratio. Idempotent per holding.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cost_split_pct:
                  type: number
                new_instrument_id:
                  type: string
                  format: uuid
                ratio_num:
                  type: number
                ratio_den:
                  type: number
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  holdings:
                    type: array
                    items:
                      type: object
                      properties:
                        holding_id:
                          type: string
                        detail:
                          type: object
        '409':
          description: Already applied
        '422':
          description: Missing parameters for this action type, or a type that is recorded via import
  /imports:
    post:
      tags:
      - Imports
      summary: Upload a statement; it is detected, parsed and applied synchronously
      description: 'Source is detected from content (CAMS/KFintech CAS text, Zerodha tradebook, HDFC/ICICI/SBI/Kotak/Axis CSV,

        Account Aggregator deposit JSON, TRACES Form 26AS). Investment rows are attributed by PAN, then by the entity holding

        the provider account, then `entity_id`. Bank statements need `bank_account_id` (AA JSON matches on the masked number).

        The same file content is never applied twice.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                source:
                  type: string
                  description: Optional hint; the parser detects the source from content
                  enum:
                  - cas
                  - contract_note
                  - pms_stmt
                  - bank_csv
                  - form26as
                  - ecas
                entity_id:
                  type: string
                  format: uuid
                bank_account_id:
                  type: string
                  format: uuid
                provider:
                  type: string
                  description: Broker name for a mapped contract-note layout
                mapping:
                  type: string
                  description: JSON-encoded ContractNoteMapping, when re-sending a file whose layout needs mapping
                file:
                  type: string
                  format: binary
                  description: Text content up to 25 MB (CSV, JSON or text extracted from a PDF)
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                source:
                  type: string
                entity_id:
                  type: string
                  format: uuid
                bank_account_id:
                  type: string
                  format: uuid
                provider:
                  type: string
                mapping:
                  $ref: '#/components/schemas/ContractNoteMapping'
      responses:
        '201':
          description: Applied (rows_ok / rows_error say how much)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '200':
          description: This exact file was imported before; nothing changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  duplicate_of_previous_upload:
                    type: boolean
        '202':
          description: Unknown contract-note layout; supply a mapping via /imports/{id}/mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '422':
          description: Nothing could be applied (empty file, no entity, missing bank account…)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
    get:
      tags:
      - Imports
      parameters:
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportJob'
  /imports/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Imports
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
  /imports/{id}/mapping:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Imports
      summary: Provide a column mapping for an unrecognised layout and re-run the stored upload
      description: The mapping is saved for the family per header signature, so later files with the same columns import directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mapping
              properties:
                provider:
                  type: string
                  example: icicidirect
                mapping:
                  $ref: '#/components/schemas/ContractNoteMapping'
                entity_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '409':
          description: The job is not waiting for a mapping
        '422':
          description: The mapping refers to missing columns or no row could be applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
  /imports/cas/refresh:
    post:
      tags:
      - Imports
      summary: Trigger an MF Central CAS refresh for an entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entity_id
              properties:
                entity_id:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
  /integrations/health:
    get:
      tags:
      - Imports
      responses:
        '200':
          description: Per-source sync health
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      type: string
                    status:
                      type: string
                      enum:
                      - healthy
                      - needs_review
                      - manual
                      - failed
                    last_run_at:
                      type: string
                      format: date-time
                    detail:
                      type: string
  /properties:
    get:
      tags:
      - Real estate
      parameters:
      - $ref: '#/components/parameters/Entity'
      responses:
        '200':
          description: Properties with latest valuation, active lease, yield
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      tags:
      - Real estate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
  /properties/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Real estate
      responses:
        '200':
          description: Property detail with P&L
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
    patch:
      tags:
      - Real estate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: Updated
  /properties/{id}/valuations:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Real estate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - valued_on
              - value
              properties:
                valued_on:
                  type: string
                  format: date
                value:
                  $ref: '#/components/schemas/Money'
                source:
                  type: string
                note:
                  type: string
      responses:
        '201':
          description: Added
  /tenants:
    get:
      tags:
      - Real estate
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      tags:
      - Real estate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
      responses:
        '201':
          description: Created
  /leases:
    get:
      tags:
      - Real estate
      parameters:
      - name: property_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lease'
    post:
      tags:
      - Real estate
      summary: Create a lease; generates rent_schedule rows for the term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
  /leases/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      tags:
      - Real estate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseInput'
      responses:
        '200':
