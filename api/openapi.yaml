                $ref: '#/components/schemas/RecommendationCluster'
  /research/clusters/{id}/restore:
    post:
      tags:
      - Research
      summary: Reverse a dismissal — the cluster is re-assessed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Fresh assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
  /research/run:
    post:
      tags:
      - Research
      summary: Run the pipeline now — extract new items, cluster, assess against the effective policy, expire stale proposals (the worker runs it hourly)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                poll:
                  type: boolean
      responses:
        '202':
          description: Counts per step
  /research/cluster:
    post:
      tags:
      - Research
      summary: Re-cluster and assess only
      responses:
        '202':
          description: Counts
  /research/digests/{id}/document:
    get:
      tags:
      - Research
      summary: The rendered digest (HTML; print to PDF)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: HTML digest
          content:
            text/html:
              schema:
                type: string
  /research/track-record/evaluate:
    post:
      tags:
      - Research
      summary: Score every recommendation at 3 / 6 / 12 / 24 months against price and benchmark and move trust scores (bounded ±5; the worker does this nightly)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as_of:
                  type: string
                  format: date
      responses:
        '202':
          description: Evaluations written and trust scores moved
  /connectors:
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Connectors with health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
    post:
      tags:
      - Action plane
      summary: Register a connector; credentials go to the vault, never stored in the row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Connector'
              - type: object
                properties:
                  credentials:
                    type: object
                    description: Provider-specific (api_key, api_secret, totp_seed …). Write-only.
      responses:
        '201':
          description: Created; may return an auth redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector:
                    $ref: '#/components/schemas/Connector'
                  auth_url:
                    type: string
                    nullable: true
  /connectors/capabilities:
    get:
      tags:
      - Action plane
      summary: Provider × kind capability matrix, payload schemas and each entity's route per intent kind (same body as /actions/schemas)
      responses:
        '200':
          description: Matrix and routes
  /connectors/{id}/credentials:
    put:
      tags:
      - Action plane
      summary: Add or rotate credentials (write-only; AES-256-GCM under the field key; only the executor reads them)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentials:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Connector (credential names only)
  /connectors/{id}/read:
    post:
      tags:
      - Action plane
      summary: Provider read as a reconciliation source (Kite MF holdings / SIPs / orders, positions, holdings, balance); MF holdings are compared with the CAS folios
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                what:
                  type: string
                  enum:
                  - mf_holdings
                  - mf_sips
                  - mf_orders
                  - positions
                  - holdings
                  - balance
      responses:
        '200':
          description: Executor job result and, for MF holdings, the reconciliation against the CAS
  /connectors/{id}/bill:
    post:
      tags:
      - Action plane
      summary: BBPS bill fetch by biller + consumer / assessment number (before a bill_payment intent)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consumer_number
              properties:
                payee_id:
                  type: string
                biller_id:
                  type: string
                consumer_number:
                  type: string
                category:
                  type: string
                property_tax_id:
                  type: string
      responses:
        '200':
          description: Fetched bill
  /connectors/{id}/jobs:
    get:
      tags:
      - Action plane
      summary: Executor jobs for a connector (session refresh, health, reads, mandate status, bill fetch, cancel, status poll)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Jobs, newest first
  /connectors/jobs/{jobId}:
    get:
      tags:
      - Action plane
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: One job
  /payees/{id}:
    patch:
      tags:
      - Action plane
      summary: Deactivate a payee or record its bank-side beneficiary status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                vpa:
                  type: string
                bbps_biller_id:
                  type: string
                beneficiary_ref:
                  type: string
                beneficiary_status:
                  type: string
      responses:
        '200':
          description: Payee
  /payees/sync:
    post:
      tags:
      - Action plane
      summary: Create payees from the platform's own records — property-tax authorities, vendors, tenants (deposit refunds), fund commitments, own bank accounts — unverified until a second user verifies them
      responses:
        '202':
          description: Count created
  /mandates:
    get:
      tags:
      - Action plane
      summary: NACH e-mandates per investor with limit, utilisation this month, headroom and expiry
      responses:
        '200':
          description: Mandates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mandate'
    post:
      tags:
      - Action plane
      summary: Register an e-mandate in favour of the MF platform (limit capped to the policy's single-amount cap); the executor submits the registration and returns the authorisation link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entity_id
              - bank_account_id
              - amount_limit
              properties:
                entity_id:
                  type: string
                bank_account_id:
                  type: string
                connector_id:
                  type: string
                amount_limit:
                  type: number
                frequency:
                  type: string
                  enum:
                  - as_and_when
                  - monthly
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                auth_mode:
                  type: string
                  enum:
                  - netbanking
                  - debit_card
                  - aadhaar
      responses:
        '201':
          description: Mandate (pending until authorised)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
  /mandates/{id}/status:
    post:
      tags:
      - Action plane
      summary: Poll the platform for the mandate's status (pending → active with UMRN)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Mandate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
  /mandates/{id}/cancel:
    post:
      tags:
      - Action plane
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Mandate cancelled
  /mandates/check:
    post:
      tags:
      - Action plane
      summary: Raise tasks for mandates expiring within 30 days and for connector sessions that expired or never opened (the worker does this hourly)
      responses:
        '200':
          description: Counts
  /actions/{id}/confirm:
    post:
      tags:
      - Action plane
      summary: The person completed an assisted instruction — record the reference (UTR / order id / receipt) and mark the intent filled; the next import reconciles it
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reference
              properties:
                reference:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Intent
  /actions/{id}/poll:
    post:
      tags:
      - Action plane
      summary: Ask the executor for the provider's current status of a submitted intent (allotment, UTR after portal authorisation)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Intent with the poll result
  /connectors/{id}:
    parameters:
    - &id012
      $ref: '#/components/parameters/Id'
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Connector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
    delete:
      tags:
      - Action plane
      summary: Revoke and purge credentials
      responses:
        '204':
          description: Revoked
    patch:
      tags:
      - Action plane
      summary: Rename, re-scope, toggle sandbox, set the static IP or the config (portal authorisation, RIA code)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                config:
                  type: object
                sandbox:
                  type: boolean
                static_ip:
                  type: string
      responses:
        '200':
          description: Connector
  /connectors/{id}/session:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      summary: Complete/refresh a session (e.g. Kite daily request_token exchange, TOTP login)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request_token:
                  type: string
                totp:
                  type: string
      responses:
        '200':
          description: Session active until
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
  /connectors/{id}/health:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      summary: Ping provider; verify scopes; sandbox dry-run order/payment
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  latency_ms:
                    type: integer
                  detail:
                    type: string
  /execution-policies:
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionPolicy'
    post:
      tags:
      - Action plane
      summary: Owner only; changes take effect for new intents and are audit-logged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionPolicy'
      responses:
        '201':
          description: Created
  /execution-policies/{id}:
    parameters:
    - *id012
    patch:
      tags:
      - Action plane
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionPolicy'
      responses:
        '200':
          description: Updated
    delete:
      tags:
      - Action plane
      responses:
        '204':
          description: Deleted
  /execution-policies/usage:
    get:
      tags:
      - Action plane
      summary: Limits consumed today / this month per entity and kind
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    entity_id:
                      type: string
                    intent_kind:
                      type: string
                    window:
                      type: string
                    amount_used: &id013
                      $ref: '#/components/schemas/Money'
                    amount_limit: *id013
                    count_used:
                      type: integer
                    count_limit:
                      type: integer
  /payees:
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Allow-listed payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payee'
    post:
      tags:
      - Action plane
      summary: Add payee; requires verification by a second user before first use; new payees blocked for block_new_payee_days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payee'
      responses:
        '201':
          description: Created (unverified)
  /payees/{id}/verify:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      responses:
        '200':
          description: Verified
        '403':
          description: Cannot verify own payee
  /kill-switch:
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: boolean
                  paused_by:
                    type: string
                  paused_at:
                    type: string
                    format: date-time
                  reason:
                    type: string
    post:
      tags:
      - Action plane
      summary: Pause or resume all execution for the family (any owner/member can pause; only owner can resume)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paused
              properties:
                paused:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Updated
  /actions/schemas:
    get:
      tags:
      - Action plane
      summary: JSON schema of the payload for each intent kind
      responses:
        '200':
          description: Schemas
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
  /actions:
    get:
      tags:
      - Action plane
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: &id023
          - draft
          - policy_failed
          - pending_approval
          - approved
          - rejected
          - expired
          - queued
          - submitted
          - partially_filled
          - filled
          - failed
          - cancelled
          - reconciled
          - posted
      - name: kind
        in: query
        schema:
          type: string
          enum: &id022
          - equity_order
          - mf_purchase
          - mf_redemption
          - mf_switch
          - mf_sip_mandate
          - bank_transfer
          - bill_payment
          - tax_payment
          - gst_payment
          - capital_call_payment
          - rent_reminder
          - assisted
      - $ref: '#/components/parameters/Entity'
      - name: batch_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Intents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
                  next_cursor:
                    type: string
                    nullable: true
    post:
      tags:
      - Action plane
      summary: Create an intent (human or rule). Runs simulation + policy checks; result is pending_approval or policy_failed. Never executes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
  /actions/{id}:
    parameters:
    - *id012
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Intent with simulation, policy, approvals, executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
    patch:
      tags:
      - Action plane
      summary: Edit a draft/policy_failed intent (re-runs checks)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentInput'
      responses:
        '200':
          description: Updated
  /actions/{id}/approve:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      summary: Approve with step-up auth (TOTP/biometric/passkey). Four-eyes enforced; N approvals required by policy; cooling-off may apply. Approval never executes directly — it queues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - auth_method
              - auth_proof
              properties:
                auth_method:
                  type: string
                  enum:
                  - totp
                  - biometric
                  - passkey
                auth_proof:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Recorded; status approved/queued when threshold met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
        '403':
          description: Proposer, insufficient role, or step-up failed
  /actions/{id}/reject:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Rejected
  /actions/{id}/cancel:
    parameters:
    - *id012
    post:
      tags:
      - Action plane
      summary: Cancel before fill; attempts provider cancel if submitted
      responses:
        '200':
          description: Cancelled or cancel requested
  /actions/batch/approve:
    post:
      tags:
      - Action plane
      summary: Approve a batch (e.g. a whole deployment plan) with one step-up; each intent still passes its own policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - batch_id
              - auth_method
              - auth_proof
              properties:
                batch_id:
                  type: string
                auth_method:
                  type: string
                auth_proof:
                  type: string
      responses:
        '200':
          description: Per-intent result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Intent'
  /actions/{id}/executions:
    parameters:
    - *id012
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Execution attempts with redacted provider request/response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /actions/from-source:
    post:
      tags:
      - Action plane
      summary: Turn a task / plan action / deployment plan / rent reminder / committed outflow into intents (one batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_type
              - source_id
              properties:
                source_type:
                  type: string
                  enum:
                  - task
                  - plan_action
                  - deployment_plan
                  - rent_schedule
                  - committed_outflow
                  - ips_breach
                  - rebalance_proposal
                source_id:
                  type: string
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  intents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
  /agent/sessions:
    post:
      tags:
      - Action plane
      summary: 'Start an assistant session with a purpose; the agent has read tools over the family data and one write tool: propose_intent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                  - rebalance
                  - deploy_cash
                  - pay_bills
                  - tax_plan
                  - question
                  - custom
                entity_id:
                  type: string
      responses:
        '201':
          description: Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  model:
                    type: string
  /agent/sessions/{id}/messages:
    parameters:
    - *id012
    get:
      tags:
      - Action plane
      responses:
        '200':
          description: Transcript incl. tool calls
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags:
      - Action plane
      summary: Send a message; reply may include proposed intents (created as draft → checked → pending_approval). The agent cannot approve, queue or execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTurn'
  /agent/tools:
    get:
      tags:
      - Action plane
      summary: 'Tool manifest exposed to the agent (read: holdings, cash, tasks, plans, ips, tax projection, prices; write: propose_intent only)'
      responses:
        '200':
          description: Tools
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    write:
                      type: boolean
  /oversight:
    get:
      tags:
      - Action plane
      summary: 'Oversight dashboard: pending approvals, in-flight, failures, limits, connector health, kill switch, anomalies, recent audit'
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
                  in_flight:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
                  failed_24h:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
                  limits:
                    type: array
                    items:
                      type: object
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connector'
                  kill_switch:
                    type: object
                  anomalies:
                    type: array
                    items:
                      type: object
                      properties:
                        intent_id:
                          type: string
                        signal:
                          type: string
                        detail:
                          type: string
                  stats_30d:
                    type: object
                    properties:
                      proposed:
                        type: integer
                      approved:
                        type: integer
                      rejected:
                        type: integer
                      executed_amount: *id013
                      ai_proposed_pct:
                        type: number
  /policies/effective:
    get:
      tags:
      - Investment policy
      summary: The governing (effective) policy for an entity or goal — what the action plane and the assistant consult
      parameters:
      - name: entity_id
        in: query
        schema:
          type: string
      - name: goal_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Effective clauses with origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePolicy'
        '404':
          description: No active policy
  /policy-reviews:
    get:
      tags:
      - Investment policy
      summary: Reviews across all policies (open first)
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyReview'
  /policy-reviews/run:
    post:
