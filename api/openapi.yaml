    post:
      tags: [Analytics]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [flow_date, kind, amount], properties: {flow_date: {type: string, format: date}, kind: {type: string, enum: [call, distribution, recallable, fee, nav]}, amount: {type: number}, forecast: {type: boolean}, source: {type: string, nullable: true}}}}}}
      responses: {'201': {description: Flow}}
  /private-investments/{id}/cashflows/{flowId}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: flowId, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [Analytics]
      responses: {'204': {description: Deleted}}
  /cashflow/forecast/run:
    post:
      tags: [Analytics]
      summary: Rebuild and persist the family's cash-flow forecast (months 3–36)
      requestBody: {content: {application/json: {schema: {type: object, properties: {months: {type: integer, default: 12}}}}}}
      responses: {'200': {description: Summary, content: {application/json: {schema: {type: object, properties: {months: {type: integer}, first_below_float: {type: string, nullable: true}, opening_cash: {type: string}, float_required: {type: string}}}}}}}
  /aa/consents:
    get:
      tags: [Banking]
      summary: Account Aggregator consents with linked accounts and the last fetch
      responses: {'200': {description: Consents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AaConsent'}}}}}}
  /aa/consents/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Banking]
      summary: One consent with its fetch history
      responses: {'200': {description: Consent, content: {application/json: {schema: {$ref: '#/components/schemas/AaConsent'}}}}}
    delete:
      tags: [Banking]
      summary: Revoke the consent — linked accounts fall back to manual / CSV
      responses: {'200': {description: Revoked}}
  /aa/consents/{id}/sync:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Banking]
      summary: Fetch FI data for every account under the consent now
      responses: {'202': {description: Sync summary, content: {application/json: {schema: {$ref: '#/components/schemas/AaSync'}}}}}
  /aa/consents/{id}/simulate:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Banking]
      summary: Sandbox only (mock provider) — play the AA's status webhook for a pending consent
      requestBody: {content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [ACTIVE, REJECTED, REVOKED, EXPIRED, PAUSED]}, accounts: {type: array, items: {type: object}}}}}}}
      responses: {'200': {description: Result}, '409': {description: Not the mock provider}}
  /bank-accounts/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Banking]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BankAccount'}}}}
      responses: {'200': {description: Updated}}
    delete:
      tags: [Banking]
      responses: {'204': {description: Removed}}
  /bank-txns/detect-transfers:
    post:
      tags: [Banking]
      summary: Flag equal-and-opposite movements between own accounts within three days as internal transfers
      requestBody: {content: {application/json: {schema: {type: object, properties: {days: {type: integer, default: 45}}}}}}
      responses: {'200': {description: Pairs flagged}}
  /categories:
    get:
      tags: [Banking]
      summary: Transaction categories (system and family)
      responses: {'200': {description: Categories}}
  /categorisation-rules/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Banking]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Rule'}}}}
      responses: {'200': {description: Updated}}
    delete:
      tags: [Banking]
      responses: {'204': {description: Deleted}}
  /categorisation-rules/apply:
    post:
      tags: [Banking]
      summary: Re-run the rules over uncategorised transactions (or all, with `all`)
      requestBody: {content: {application/json: {schema: {type: object, properties: {all: {type: boolean}, days: {type: integer, default: 365}}}}}}
      responses: {'200': {description: Rows changed}}
  /categorisation-rules/test:
    post:
      tags: [Banking]
      summary: Which rule a narration would match
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [narration], properties: {narration: {type: string}, counterparty: {type: string}}}}}}
      responses: {'200': {description: Match or null}}
  /committed-outflows/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Working capital]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommittedOutflow'}}}}
      responses: {'200': {description: Updated}}
    delete:
      tags: [Working capital]
      summary: Remove a manual outflow
      responses: {'204': {description: Deleted}}
  /ingest/email:
    get:
      tags: [Imports]
      summary: E-mails received at the family's ingest address
      parameters: [{name: status, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, default: 50}}]
      responses: {'200': {description: Messages, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/EmailIngest'}}}}}}
    post:
      tags: [Imports]
      security: []
      summary: Gateway hook — a parsed inbound e-mail, signed over the raw body with `X-Ingest-Signature` (HMAC-SHA256)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [from, to], properties: {message_id: {type: string}, from: {type: string}, to: {type: string}, subject: {type: string}, text: {type: string}, received_at: {type: string, format: date-time}, attachments: {type: array, items: {type: object, required: [name, content_base64], properties: {name: {type: string}, content_type: {type: string}, content_base64: {type: string}}}}}}}}}
      responses: {'202': {description: Accepted, quarantined or imported, content: {application/json: {schema: {$ref: '#/components/schemas/EmailIngest'}}}}, '401': {description: Bad signature}, '404': {description: No family at that address}}
  /ingest/email/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Imports]
      responses: {'200': {description: Message, content: {application/json: {schema: {$ref: '#/components/schemas/EmailIngest'}}}}}
  /ingest/email/{id}/release:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Imports]
      summary: Import a quarantined message's attachments; optionally trust the sender
      requestBody: {content: {application/json: {schema: {type: object, properties: {allow_sender: {type: boolean, default: false}}}}}}
      responses: {'200': {description: Processed}, '409': {description: Not quarantined}}
  /ingest/email/{id}/reject:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Imports]
      responses: {'200': {description: Rejected}}
  /ingest/settings:
    get:
      tags: [Imports]
      summary: Ingest address, allowed senders, quarantine flag
      responses: {'200': {description: Settings}}
    patch:
      tags: [Imports]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {allow_senders: {type: array, items: {type: string}}, quarantine_unknown: {type: boolean}}}}}}
      responses: {'200': {description: Settings}}
  /feeds/health:
    get:
      tags: [Investments]
      summary: Last run per feed job, stale holdings, latest price dates and benchmark coverage
      responses: {'200': {description: Health}}
  /feeds/run:
    post:
      tags: [Investments]
      summary: Run feed jobs now (owner / member)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [which], properties: {which: {type: array, items: {type: string, enum: [amfi, eod, indices, ca, tri, series]}}, date: {type: string, format: date}}}}}}
      responses: {'200': {description: Results per job}, '502': {description: A feed failed}}
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrolment for the signed-in user; returns the secret once with an otpauth URI
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {secret: {type: string}, otpauth_uri: {type: string}}}}}}}
  /auth/mfa/confirm:
    post:
      tags: [Auth]
      summary: Confirm enrolment with a code from the authenticator; switches MFA on for login
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {mfa_enabled: {type: boolean}}}}}}, '401': {description: Wrong code}, '409': {description: Setup not started}}
  /auth/mfa:
    delete:
      tags: [Auth]
      summary: Switch MFA off (needs a current code)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses: {'200': {description: OK}, '401': {description: Wrong code}}
  /auth/invite/accept:
    post:
      tags: [Auth]
      security: []
      summary: Accept an invitation with the e-mailed token and set a password (single use, 14 days)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, token, password], properties: {email: {type: string, format: email}, token: {type: string}, password: {type: string, minLength: 10}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, family_id: {type: string}}}}}}, '403': {description: Invitation not found, used or expired}}
  /members/{userId}:
    parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Family]
      summary: Owner changes a member's role or entity scope (read per request, not from the token)
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {role: {type: string, enum: [owner, member, operator, viewer]}, entity_scope: {type: array, nullable: true, items: {type: string}}}}}}}
      responses: {'200': {description: OK}, '404': {description: Not a member}}
    delete:
      tags: [Family]
      summary: Owner removes a member; owners cannot remove themselves
      responses: {'204': {description: Removed}, '409': {description: Cannot remove yourself}}
  /allocation/policy/review:
    post:
      tags: [Goals]
      summary: Record a strategic-allocation review (owner); rolls next_review_on forward by the policy cadence
      requestBody: {content: {application/json: {schema: {type: object, properties: {note: {type: string}, outcome: {type: string, enum: [confirmed, changed]}}}}}}
      responses: {'201': {description: Recorded}}
  /working-capital/plans:
    get:
      tags: [Banking]
      summary: Deployment plans built so far, newest first
      responses: {'200': {description: OK}}
  /working-capital/excess:
    get:
      tags: [Banking]
      summary: Idle cash above the float per account with the days it has sat there
      responses: {'200': {description: OK}}
  /global/lrs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [Investments]
      summary: Remove a remittance entered in error (audited)
      responses: {'204': {description: Deleted}}
  /global/foreign-tax-credits/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Investments]
      summary: Mark Form 67 filed, correct amounts or the DTAA article
      requestBody: {content: {application/json: {schema: {type: object, properties: {form67_filed_on: {type: string, format: date, nullable: true}, income_inr: {type: number}, foreign_tax_inr: {type: number}, dtaa_article: {type: string, nullable: true}, note: {type: string, nullable: true}}}}}}
      responses: {'200': {description: OK}}
    delete:
      tags: [Investments]
      responses: {'204': {description: Deleted}}
  /private-companies/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Startups]
      summary: Update company details
      requestBody: {content: {application/json: {schema: {type: object, properties: {name: {type: string}, cin: {type: string, nullable: true}, sector: {type: string, nullable: true}, website: {type: string, nullable: true}}}}}}
      responses: {'200': {description: OK}}
  /gl/period-end/preview:
    get:
      tags: [Books]
      summary: Mark-to-market per investment account (market vs book balance) and the depreciation schedule from depreciation_rates
      parameters: [{name: entity_id, in: query, required: true, schema: {type: string}}, {name: as_of, in: query, schema: {type: string, format: date}}, {name: fy, in: query, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {mtm: {type: object}, depreciation: {type: object}}}}}}}
  /gl/period-end/post:
    post:
      tags: [Books]
      summary: Post the period's MTM (reserve or P&L) and / or depreciation journals once; re-running returns the existing journals
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [entity_id, period_id], properties: {entity_id: {type: string}, period_id: {type: string}, what: {type: string, enum: [both, mtm, depreciation]}}}}}}
      responses: {'201': {description: Posted (or already posted)}}
  /gl/depreciation/schedule:
    get:
      tags: [Books]
      summary: Per-asset schedule for the FY (opening WDV, rate, charge, posted, closing WDV)
      parameters: [{name: entity_id, in: query, required: true, schema: {type: string}}, {name: fy, in: query, schema: {type: string}}]
      responses: {'200': {description: OK}}
  /gl/depreciation/rates:
    get:
      tags: [Books]
      summary: Depreciation rates as data (asset kind, method, rate, effective FY)
      responses: {'200': {description: OK}}
  /gl/tally/ping:
    get:
      tags: [Books]
      summary: Reach the book's Tally HTTP gateway and list open companies
      parameters: [{name: entity_id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: OK}, '422': {description: No Tally endpoint configured}, '502': {description: Tally unreachable}}
  /gl/tally/push:
    post:
      tags: [Books]
      summary: Push ledger masters and vouchers for a date range straight into Tally (live)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [entity_id, from, to], properties: {entity_id: {type: string}, from: {type: string, format: date}, to: {type: string, format: date}, include_masters: {type: boolean}}}}}}
      responses: {'200': {description: Tally counts (created / altered / errors) and line errors}, '502': {description: Tally unreachable}}
  /gl/tally/pull:
    post:
      tags: [Books]
      summary: Pull Tally's day book for a range and import it (GUID de-duplicated)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [entity_id, from, to], properties: {entity_id: {type: string}, from: {type: string, format: date}, to: {type: string, format: date}, mapping: {type: object, additionalProperties: {type: string}}}}}}}
      responses: {'200': {description: Imported}, '422': {description: Unmapped Tally ledgers listed}}
  /export-schedules:
    get:
      tags: [Open data]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ExportSchedule'}}}}}}
    post:
      tags: [Open data]
      summary: Schedule a dataset export on a cron; each run is an export job with a document and an export.ready webhook
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExportSchedule'}}}}
      responses: {'201': {description: Created}}
  /export-schedules/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Open data]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ExportSchedule'}}}}
      responses: {'200': {description: OK}}
    delete:
      tags: [Open data]
      responses: {'204': {description: Deleted}}
  /export-schedules/{id}/run:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Open data]
      summary: Run one schedule now
      responses: {'202': {description: Export job created}}
  /export-schedules/run-due:
    post:
      tags: [Open data]
      summary: Run every schedule that is due (owner; the worker calls this hourly)
      requestBody: {content: {application/json: {schema: {type: object, properties: {now: {type: string, format: date-time}}}}}}
      responses: {'200': {description: Results per schedule}}
  /instruments/fmv:
    post:
      tags: [Investments]
      summary: Load 31 Jan 2018 fair market values per ISIN (Section 112A grandfathering); copied to pre-Feb-2018 lots, applied on the next sale
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {rows: {type: array, items: {type: object, required: [isin, fmv], properties: {isin: {type: string}, fmv: {type: number}, name: {type: string}}}}, csv: {type: string, description: 'isin,fmv[,name] lines'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {rows: {type: integer}, matched: {type: integer}, lots_updated: {type: integer}, unknown: {type: array, items: {type: string}}}}}}}, '422': {description: No usable rows}}
  /instruments/exit-load:
    post:
      tags: [Investments]
      summary: Load scheme-master exit loads per ISIN; overrides the generic 1%/365-day equity-fund guess rebalancing falls back to
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {rows: {type: array, items: {type: object, required: [isin, pct, days], properties: {isin: {type: string}, pct: {type: number}, days: {type: integer}, note: {type: string}}}}, csv: {type: string, description: 'isin,pct,days[,note] lines'}}}}}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {rows: {type: integer}, matched: {type: integer}, unknown: {type: array, items: {type: string}}}}}}}, '422': {description: No usable rows}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Entity:
      name: entity_id
      in: query
      description: Filter to one entity; omit for all entities
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              errors:
                type: array
                items:
                  type: object
  schemas:
    ExportSchedule:
      type: object
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        dataset: {type: string}
        format: {type: string, enum: [csv, jsonl, xlsx, parquet]}
        filters: {type: object, properties: {entity_id: {type: string, nullable: true}, from: {type: string, nullable: true}, to: {type: string, nullable: true}}}
        cron: {type: string, description: 5-field cron, UTC}
        active: {type: boolean}
        webhook: {type: boolean, description: emit export.ready on every run}
        next_run_at: {type: string, format: date-time, readOnly: true}
        last_run_at: {type: string, format: date-time, readOnly: true, nullable: true}
        last_export_id: {type: string, readOnly: true, nullable: true}
        last_error: {type: string, readOnly: true, nullable: true}
    Money:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]{1,2})?$
      example: '285000.00'
      description: Rupees as decimal string
    Role:
      type: string
      enum:
      - owner
      - member
      - operator
      - viewer
    Bucket:
      type: string
      enum:
      - liquidity
      - income
      - growth
    LinkType:
      type: string
      enum:
      - none
      - rent
      - dividend
      - interest
      - redemption
      - sip
      - drawdown
      - property_tax
      - expense
      - transfer
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        families:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                $ref: '#/components/schemas/Role'
    Family:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ingest_address:
          type: string
    EntityInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - individual
          - huf
          - trust
          - llp
          - company
        name:
          type: string
        pan:
          type: string
          pattern: ^[A-Z]{5}[0-9]{4}[A-Z]$
        dob_or_incorp:
          type: string
          format: date
        tax_regime:
          type: string
          enum:
          - old
          - new
        slab_rate:
          type: number
    Entity:
      allOf:
      - $ref: '#/components/schemas/EntityInput'
      - type: object
        properties:
          id:
            type: string
          pan_last4:
            type: string
          gstins:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                gstin:
                  type: string
    Instrument:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - stock
          - etf
          - mf
          - pms
          - aif
          - bond
          - sgb
          - gsec
          - tbill
          - fd
          - rd
          - nps
          - ppf
          - epf
          - insurance
          - gold
          - silver
          - reit
          - invit
          - foreign_stock
          - foreign_etf
          - foreign_fund
          - gift_city
        isin:
          type: string
        symbol:
          type: string
        name:
          type: string
        amfi_code:
          type: string
        asset_class:
          type: string
        default_bucket:
          $ref: '#/components/schemas/Bucket'
        currency:
          type: string
          example: INR
        country:
          type: string
          example: IN
        alloc_class:
          $ref: '#/components/schemas/AllocClass'
        held:
          type: boolean
          description: Search results only — the family holds this instrument
        last_price:
          type: number
          nullable: true
        price_date:
          type: string
          format: date
          nullable: true
    Holding:
      type: object
      properties:
        id:
          type: string
        entity_id:
          type: string
        entity_name:
          type: string
        account_id:
          type: string
          nullable: true
        instrument:
          $ref: '#/components/schemas/Instrument'
        bucket:
          $ref: '#/components/schemas/Bucket'
        goal_id:
          type: string
          nullable: true
        quantity:
          type: number
        cost:
          $ref: '#/components/schemas/Money'
        value:
          $ref: '#/components/schemas/Money'
        unrealised_gain:
          $ref: '#/components/schemas/Money'
        unrealised_gain_pct:
          type: number
        xirr_pct:
          type: number
          nullable: true
        price_as_of:
          type: string
          format: date
        core_satellite:
          type: string
          enum:
          - core
          - satellite
        currency:
          type: string
        value_ccy:
          type: string
          nullable: true
          description: Value in instrument currency for foreign holdings
        fx_rate:
          type: number
          nullable: true
    HoldingPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
        totals:
          type: object
          properties:
            cost:
              $ref: '#/components/schemas/Money'
            value:
              $ref: '#/components/schemas/Money'
        next_cursor:
          type: string
          nullable: true
    Lot:
      type: object
      properties:
        id:
          type: string
        buy_date:
          type: string
          format: date
        quantity:
          type: number
