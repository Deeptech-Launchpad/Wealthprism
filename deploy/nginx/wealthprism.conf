# Production edge on the VPS host (not a container): nginx terminates TLS for wealthprism.in and proxies to Caddy on 127.0.0.1:8080.
# Install: sudo cp deploy/nginx/wealthprism.conf /etc/nginx/sites-available/wealthprism && sudo ln -sf ../sites-available/wealthprism /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d wealthprism.in -d www.wealthprism.in -d app.wealthprism.in --redirect   (certbot rewrites this file to add TLS)
server {
    listen 80;
    listen [::]:80;
    server_name wealthprism.in www.wealthprism.in app.wealthprism.in;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
